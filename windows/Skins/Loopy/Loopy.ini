[Rainmeter]
Update=32
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,0
SkinWidth=156
SkinHeight=177
DefaultAlwaysOnTop=1
DefaultDraggable=1
OnRefreshAction=[!ActivateConfig "Loopy\Activity" "Activity.ini"][!CommandMeasure PointerReader "Run"]
OnCloseAction=[!Hide "Loopy\Activity"]
ContextTitle=待机
ContextAction=[!CommandMeasure LoopyAnimation "Play(0)"]
ContextTitle2=向右跑
ContextAction2=[!CommandMeasure LoopyAnimation "Play(1)"]
ContextTitle3=向左跑
ContextAction3=[!CommandMeasure LoopyAnimation "Play(2)"]
ContextTitle4=挥挥手
ContextAction4=[!CommandMeasure LoopyAnimation "Play(3)"]
ContextTitle5=跳一下
ContextAction5=[!CommandMeasure LoopyAnimation "Play(4)"]
ContextTitle6=遇到错误
ContextAction6=[!CommandMeasure LoopyAnimation "Play(5)"]
ContextTitle7=等你回复
ContextAction7=[!CommandMeasure LoopyAnimation "Play(6)"]
ContextTitle8=敲电脑
ContextAction8=[!CommandMeasure LoopyAnimation "Play(7)"]
ContextTitle9=检查回复
ContextAction9=[!CommandMeasure LoopyAnimation "Play(8)"]
ContextTitle10=预览视线
ContextAction10=[!CommandMeasure LoopyAnimation "PreviewGaze()"]
ContextTitle11=退出 Loopy
ContextAction11=[!Quit]
RightMouseUpAction=[!SkinCustomMenu]

[Metadata]
Name=Loopy
Information=Antigravity 桌面伙伴
Version=1.3

[Variables]
UserHome=%USERPROFILE%
Frame=0-0
Activity=待机

[PointerReader]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -STA -WindowStyle Hidden -File "#@#Pointer.ps1"
State=Hide
Timeout=-1
UpdateDivider=-1

[LaunchAntigravity]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -File "#@#LaunchAntigravity.ps1"
State=Hide
Timeout=10000
UpdateDivider=-1

[ConversationFolder]
Measure=Plugin
Plugin=FileView
Path=%USERPROFILE%\.gemini\antigravity\brain
Recursive=2
WildcardSearch=transcript.jsonl
Extensions=jsonl
Count=12
ShowHidden=1
SortType=Date
SortDateType=Modified
SortAscending=0
UpdateDivider=32
OnUpdateAction=[!CommandMeasure ConversationFolder Update]

[LatestPath1]
Measure=Plugin
Plugin=FileView
Path=[ConversationFolder]
Type=FilePath
Index=1

