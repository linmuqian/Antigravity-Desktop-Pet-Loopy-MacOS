[LoopyAnimation]
Measure=Script
ScriptFile=#@#Loopy.lua

[Portrait]
Meter=Image
X=21
Y=-5
W=112
H=121
ImageName=#@#Frames\#Frame#.png
DynamicVariables=1

[PortraitHit]
Meter=Image
X=21
Y=-5
W=112
H=121
SolidColor=0,0,0,1
MouseOverAction=[!CommandMeasure LoopyAnimation "Hover(1)"]
MouseLeaveAction=[!CommandMeasure LoopyAnimation "Hover(0)"]
LeftMouseUpAction=[!CommandMeasure LoopyAnimation "Tap()"]
LeftMouseDoubleClickAction=[!CommandMeasure LoopyAnimation "DoubleTap()"]

[ToolStrip]
Meter=Image
X=0
Y=101
W=156
H=76
ImageName=#@#UI\Toolbar.png

[OpenApp]
Meter=Image
X=18
Y=119
W=40
H=40
SolidColor=255,255,255,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure LoopyAnimation "OpenApp()"]
ToolTipText=打开 Antigravity 对话

[Voice]
Meter=Image
X=58
Y=119
W=40
H=40
SolidColor=255,255,255,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure LoopyAnimation "Voice()"]
ToolTipText=打开 Antigravity 语音入口

[History]
Meter=Image
X=98
Y=119
W=40
H=40
SolidColor=255,255,255,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure LoopyAnimation "Toggle()"]
ToolTipText=查看或收起最近对话
